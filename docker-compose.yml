services:
  postgres:
    image: postgres:17
    container_name: ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ledger}
      POSTGRES_USER: ${DB_USERNAME:-ledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledger}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
