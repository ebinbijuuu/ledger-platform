server.port=8080

# Load the repository's local .env when starting from the backend directory.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}}
spring.datasource.username=${DB_USERNAME:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
